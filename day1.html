<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>

    html, body{
      margin:0;
      width:100%;
      height:100%;

      background:#191919;

      overflow:hidden;
    }

    body{
      display:flex;
      justify-content:flex-start;
      align-items:center;

      padding-left:4px;

      font-family:Arial,sans-serif;
    }

    .day-number{
      color:#00ccf5;

      font-size:1.5em;
      font-weight:bold;

      line-height:1;
    }

  </style>
</head>

<body>

  <div class="day-number" id="dayNumber"></div>

  <script>

    const today = new Date();

    const dayNumbers = [
      "1",
      "2",
      "3",
      "4",
      "5",
      "6",
      "7"
    ];

    document.getElementById("dayNumber").innerHTML =
      dayNumbers[today.getDay()];

  </script>

</body>
</html>
